
name: Build Vung Facebook AI Auto APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Extract and locate Android source
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="$RUNNER_TEMP/vung-source"
          mkdir -p "$SOURCE_DIR"

          ZIP_FILE="$(find . -maxdepth 4 -type f \
            -iname 'Vung-Facebook-AI-Auto-v2.zip' \
            -not -path './.git/*' | head -n 1 || true)"

          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d "$SOURCE_DIR"
            SEARCH_ROOT="$SOURCE_DIR"
          else
            echo "Source ZIP not found; checking repository source."
            SEARCH_ROOT="$GITHUB_WORKSPACE"
          fi

          SETTINGS="$(find "$SEARCH_ROOT" -type f \
            \( -name settings.gradle.kts \
            -o -name settings.gradle \) \
            -not -path '*/.gradle/*' | head -n 1 || true)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Không tìm thấy settings.gradle.kts hoặc settings.gradle."
            find "$SEARCH_ROOT" -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Không tìm thấy module app trong $PROJECT_DIR."
            find "$PROJECT_DIR" -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"
          cat "$SETTINGS"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          gradle --version
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::Không tạo được app-debug.apk."
            find "$PROJECT_DIR" -type f -name '*.apk' -print || true
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vung-Facebook-AI-Auto-debug-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
