
name: Build Vung Facebook AI Auto APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK not found: $SDK"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$RUNNER_TEMP/vung-source"
          mkdir -p "$ROOT"

          ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 4 \
            -type f -iname 'Vung-Facebook-AI-Auto-v2.zip' \
            -not -path '*/.git/*' | head -n 1 || true)"

          if [ -n "$ZIP" ]; then
            echo "Using archive: $ZIP"
            unzip -q "$ZIP" -d "$ROOT"
            SEARCH="$ROOT"
          else
            echo "No source archive; checking repository."
            SEARCH="$GITHUB_WORKSPACE"
          fi

          SETTINGS="$(find "$SEARCH" -type f \
            \( -name settings.gradle.kts \
               -o -name settings.gradle \) \
            -not -path '*/.gradle/*' | head -n 1 || true)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::No Gradle settings file found."
            find "$SEARCH" -maxdepth 5 -type f | head -200
            exit 1
          fi

          DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$DIR/app/build.gradle.kts" ] && \
             [ ! -f "$DIR/app/build.gradle" ]; then
            echo "::error::Android app module not found: $DIR"
            find "$DIR" -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $DIR"
          echo "Gradle settings:"
          cat "$SETTINGS"

          echo "Android build configuration:"
          find "$DIR" -maxdepth 3 -type f \
            \( -name 'build.gradle' -o -name 'build.gradle.kts' \
               -o -name 'gradle.properties' \
               -o -name 'libs.versions.toml' \) -print

      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail

          VERSION="8.9"
          DEST="$RUNNER_TEMP/gradle-$VERSION"

          curl --fail --location --retry 3 \
            "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" \
            -o "$RUNNER_TEMP/gradle.zip"

          unzip -q -o "$RUNNER_TEMP/gradle.zip" \
            -d "$RUNNER_TEMP"

          echo "$DEST/bin" >> "$GITHUB_PATH"
          "$DEST/bin/gradle" --version

      - name: Build APK and capture errors
        id: build
        continue-on-error: true
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -uo pipefail

          cd "$PROJECT_DIR"
          LOG="$RUNNER_TEMP/android-build.log"

          echo "===== Java =====" | tee "$LOG"
          java -version 2>&1 | tee -a "$LOG"

          echo "===== Android SDK =====" | tee -a "$LOG"
          echo "$ANDROID_HOME" | tee -a "$LOG"

          echo "===== Gradle build =====" | tee -a "$LOG"

          gradle --no-daemon --console=plain \
            --stacktrace clean assembleDebug \
            2>&1 | tee -a "$LOG"

          RESULT=${PIPESTATUS[0]}
          echo "exit_code=$RESULT" >> "$GITHUB_OUTPUT"

          echo "===== Error summary ====="
          grep -n -E \
            'What went wrong:|Execution failed for task|Could not resolve|Could not find|^e: | error:|SDK location not found|Unsupported class file|Minimum supported Gradle version' \
            "$LOG" | head -100 || true

          exit "$RESULT"

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostic-log
          path: ${{ runner.temp }}/android-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify APK
        if: steps.build.outcome == 'success'
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::Build succeeded but APK is missing: $APK"
            find "$PROJECT_DIR" -type f -name '*.apk' -print || true
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Vung-Facebook-AI-Auto-debug-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: |
          echo "::error::Gradle build failed. Download android-build-diagnostic-log from Artifacts."
          exit 1
