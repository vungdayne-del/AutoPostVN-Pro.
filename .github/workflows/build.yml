
name: Build Vung Facebook AI Auto APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Detect Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository root:"
          pwd
          ls -la

          PROJECT_DIR=""

          # Ưu tiên Gradle Wrapper ở thư mục gốc.
          if [ -f "./gradlew" ] && \
             { [ -f "./settings.gradle" ] || [ -f "./settings.gradle.kts" ]; }; then
            PROJECT_DIR="."
          elif [ -f "./android/gradlew" ] && \
               { [ -f "./android/settings.gradle" ] || [ -f "./android/settings.gradle.kts" ]; }; then
            PROJECT_DIR="./android"
          else
            # Tìm settings.gradle ở các thư mục con.
            while IFS= read -r FILE; do
              DIR="$(dirname "$FILE")"
              if [ -f "$DIR/gradlew" ]; then
                PROJECT_DIR="$DIR"
                break
              fi
            done < <(
              find . -maxdepth 6 -type f \
                \( -name settings.gradle -o -name settings.gradle.kts \) \
                -not -path './.git/*' | sort
            )
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Không tìm thấy dự án Android có settings.gradle và gradlew."
            echo "Hãy kiểm tra mã nguồn Android và Gradle Wrapper trong repository."
            echo "Các file Gradle hiện có:"
            find . -maxdepth 6 -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \
                 -o -name build.gradle -o -name build.gradle.kts \
                 -o -name gradlew \) \
              -not -path './.git/*' -print
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f "gradlew" ]; then
            echo "::error::Thiếu Gradle Wrapper (gradlew)."
            exit 1
          fi

          chmod +x gradlew

          # Kiểm tra cấu hình trước khi build.
          ./gradlew --version
          ./gradlew --no-daemon clean assembleDebug

      - name: Find generated APK
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          APK_PATH="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -not -name '*unaligned*' | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::Build không tạo ra APK debug."
            exit 1
          fi

          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "APK generated: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vung-Facebook-AI-Auto-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
