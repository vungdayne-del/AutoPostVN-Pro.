
name: Build Vung Facebook AI Auto APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::Android SDK directory not found."
            env | grep -E 'ANDROID_HOME|ANDROID_SDK_ROOT' || true
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found in $SDK/cmdline-tools"
            find "$SDK" -maxdepth 4 -type f -name sdkmanager || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate and extract source
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$RUNNER_TEMP/vung-source"
          mkdir -p "$ROOT"

          ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 5 \
            -type f -iname 'Vung-Facebook-AI-Auto-v2.zip' \
            -not -path '*/.git/*' | head -n 1 || true)"

          if [ -n "$ZIP" ]; then
            echo "Source archive: $ZIP"
            unzip -q "$ZIP" -d "$ROOT"
            SEARCH="$ROOT"
          else
            echo "Archive not found; searching repository source."
            SEARCH="$GITHUB_WORKSPACE"
          fi

          SETTINGS="$(find "$SEARCH" -type f \
            \( -name settings.gradle.kts \
               -o -name settings.gradle \) \
            -not -path '*/.gradle/*' | head -n 1 || true)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Gradle settings file was not found."
            find "$SEARCH" -maxdepth 6 -type f | head -200
            exit 1
          fi

          DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$DIR/app/build.gradle.kts" ] && \
             [ ! -f "$DIR/app/build.gradle" ]; then
            echo "::error::Android app module was not found in $DIR."
            find "$DIR" -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

          echo "===== Project directory ====="
          echo "$DIR"
          echo "===== Gradle settings ====="
          cat "$SETTINGS"
          echo "===== Build files ====="
          find "$DIR" -maxdepth 3 -type f \
            \( -name 'build.gradle' -o -name 'build.gradle.kts' \
               -o -name 'gradle.properties' \) -print

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail

          VERSION="8.9"
          DEST="$RUNNER_TEMP/gradle-$VERSION"

          curl --fail --location --retry 3 \
            "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" \
            -o "$RUNNER_TEMP/gradle.zip"

          unzip -q -o "$RUNNER_TEMP/gradle.zip" \
            -d "$RUNNER_TEMP"

          echo "$DEST/bin" >> "$GITHUB_PATH"
          "$DEST/bin/gradle" --version

      - name: Build debug APK
        id: build
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -uo pipefail

          cd "$PROJECT_DIR"
          LOG="$RUNNER_TEMP/android-build.log"

          echo "Project: $PROJECT_DIR" | tee "$LOG"
          echo "Java version:" | tee -a "$LOG"
          java -version 2>&1 | tee -a "$LOG"

          echo "Android SDK: $ANDROID_HOME" | tee -a "$LOG"
          echo "Gradle build output:" | tee -a "$LOG"

          set +e
          gradle --no-daemon --console=plain \
            --stacktrace clean assembleDebug \
            2>&1 | tee -a "$LOG"
          RESULT=${PIPESTATUS[0]}
          set -e

          echo "===== BUILD ERROR SUMMARY ====="

          grep -n -A 8 -B 3 -E \
            'What went wrong:|Execution failed for task|Could not resolve|Could not find|Compilation error|Unresolved reference|SDK location not found|Unsupported class file|Minimum supported Gradle version|^e: | error:' \
            "$LOG" | head -160 || true

          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Gradle failed with exit code $RESULT"
            echo "Full log will be uploaded as an artifact."
            exit "$RESULT"
          fi

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostic-log
          path: ${{ runner.temp }}/android-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify APK
        if: success()
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK missing after successful build: $APK"
            find "$PROJECT_DIR" -type f -name '*.apk' -print || true
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Vung-Facebook-AI-Auto-debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
