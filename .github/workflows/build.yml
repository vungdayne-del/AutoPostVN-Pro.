
name: Build Vung Facebook AI Auto APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find and extract project ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/vung-source"

          ZIP_FILE=""

          if [ -f "Vung-Facebook-AI-Auto-v2.zip" ]; then
            ZIP_FILE="Vung-Facebook-AI-Auto-v2.zip"
          else
            ZIP_FILE="$(find . -maxdepth 4 -type f \
              -iname 'Vung-Facebook-AI-Auto-v2.zip' \
              -not -path './.git/*' | head -n 1 || true)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Không tìm thấy Vung-Facebook-AI-Auto-v2.zip."
            echo "Các file trong repository:"
            find . -maxdepth 3 -type f | head -200
            exit 1
          fi

          echo "Found source archive: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/vung-source"

          SETTINGS_FILE="$(find "$RUNNER_TEMP/vung-source" \
            -type f \( -name settings.gradle.kts \
            -o -name settings.gradle \) \
            | head -n 1 || true)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::ZIP không chứa settings.gradle hoặc settings.gradle.kts."
            find "$RUNNER_TEMP/vung-source" -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Không tìm thấy cấu hình module app trong $PROJECT_DIR."
            find "$PROJECT_DIR" -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_VERSION="8.9"
          GRADLE_HOME="$RUNNER_TEMP/gradle-$GRADLE_VERSION"

          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
            curl --fail --location --retry 3 \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              --output "$RUNNER_TEMP/gradle.zip"

            unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          fi

          echo "$GRADLE_HOME/bin" >> "$GITHUB_PATH"
          "$GRADLE_HOME/bin/gradle" --version

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Không có APK tại đường dẫn mong đợi: $APK_PATH"
            echo "Các APK tìm thấy:"
            find "$PROJECT_DIR" -type f -name '*.apk' -print || true
            exit 1
          fi

          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_PATH"
          file "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vung-Facebook-AI-Auto-debug-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
