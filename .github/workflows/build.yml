
name: Build Vung Facebook AI Auto APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "::error::Không tìm thấy Android SDK tại $SDK"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Không tìm thấy sdkmanager trong Android SDK."
            exit 1
          fi

          echo "Using SDK manager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"

      - name: Extract and locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="$RUNNER_TEMP/vung-source"
          mkdir -p "$SOURCE"

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 4 -type f \
            -iname 'Vung-Facebook-AI-Auto-v2.zip' \
            -not -path '*/.git/*' | head -n 1 || true)"

          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d "$SOURCE"
            SEARCH_ROOT="$SOURCE"
          else
            echo "ZIP not found; checking repository source."
            SEARCH_ROOT="$GITHUB_WORKSPACE"
          fi

          SETTINGS="$(find "$SEARCH_ROOT" \
            -type f \
            \( -name settings.gradle.kts \
               -o -name settings.gradle \) \
            -not -path '*/.gradle/*' \
            | head -n 1 || true)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Không tìm thấy settings.gradle(.kts)."
            find "$SEARCH_ROOT" -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "::error::Không tìm thấy cấu hình module app."
            find "$PROJECT" -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT"
          ls -la "$PROJECT"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail

          VERSION="8.9"
          DEST="$RUNNER_TEMP/gradle-$VERSION"

          if [ ! -x "$DEST/bin/gradle" ]; then
            curl --fail --location --retry 3 \
              "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" \
              -o "$RUNNER_TEMP/gradle.zip"

            unzip -q "$RUNNER_TEMP/gradle.zip" \
              -d "$RUNNER_TEMP"
          fi

          echo "$DEST/bin" >> "$GITHUB_PATH"
          "$DEST/bin/gradle" --version

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::Không tìm thấy APK sau khi build."
            find "$PROJECT_DIR" -type f -name '*.apk' -print || true
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vung-Facebook-AI-Auto-debug-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
